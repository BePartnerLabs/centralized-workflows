name: Migrate — Payload

# Runners fijados a 24.04 a proposito: `ubuntu-latest` pasa a Ubuntu 26 desde el
# 19 de octubre de 2026. Estos workflows los consume toda la organizacion como
# `@v1`, asi que una mudanza sorpresa del runner rompe el CI de todos los repos
# a la vez. Fijarlo no evita la mudanza: elige cuando. **Revisar antes de
# octubre de 2026** — un runner fijado y olvidado tambien caduca.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to run migrations against (e.g. preview, production)
        type: string
        required: true
      node-version:
        type: string
        default: "24"
    secrets:
      PAYLOAD_SECRET:
        required: true
      DATABASE_URL:
        required: true

jobs:
  migrate:
    name: Run DB migrations (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm payload migrate
        env:
          CI: true
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
