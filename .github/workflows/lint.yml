name: Lint

# Runners fijados a 24.04 a proposito: `ubuntu-latest` pasa a Ubuntu 26 desde el
# 19 de octubre de 2026. Estos workflows los consume toda la organizacion como
# `@v1`, asi que una mudanza sorpresa del runner rompe el CI de todos los repos
# a la vez. Fijarlo no evita la mudanza: elige cuando. **Revisar antes de
# octubre de 2026** — un runner fijado y olvidado tambien caduca.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      cache-key:
        type: string
        required: true
      store-path:
        type: string
        required: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@v6
        with:
          path: ${{ inputs.store-path }}
          key: ${{ inputs.cache-key }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
