name: Sync Major Version Tag

# Runners fijados a 24.04 a proposito: `ubuntu-latest` pasa a Ubuntu 26 desde el
# 19 de octubre de 2026. Estos workflows los consume toda la organizacion como
# `@v1`, asi que una mudanza sorpresa del runner rompe el CI de todos los repos
# a la vez. Fijarlo no evita la mudanza: elige cuando. **Revisar antes de
# octubre de 2026** — un runner fijado y olvidado tambien caduca.

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  sync-major-tag:
    name: Move vN tag to released commit
    runs-on: ubuntu-24.04
    steps:
      - name: Move major version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MAJOR=$(echo "$TAG" | grep -oP '^v\d+')
          if [ -z "$MAJOR" ]; then
            echo "Could not parse major version from tag '$TAG'" && exit 1
          fi
          # Resolve the tag SHA (handles branch names like "main" as target_commitish)
          RESOLVED_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$MAJOR" 2>/dev/null || true
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$MAJOR" \
            -f sha="$RESOLVED_SHA"
          echo "Moved $MAJOR → $TAG ($RESOLVED_SHA)"
